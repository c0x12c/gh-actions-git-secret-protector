---
name: Publish to GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.*'

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

      # The rolling `:1` tag is what every consumer resolves, so a silently stale
      # image is invisible until a decrypt fails in someone else's pipeline.
      # Fail the release here instead.
      - name: Verify published image
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker run --rm --entrypoint git-secret-protector "$image" version
