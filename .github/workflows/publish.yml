---
name: Publish to GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GITHUB_TOKEN is denied write_package on this pre-existing org package
      # (created via a user PAT); authenticate GHCR with the org GitHub App token.
      # owner: scopes the installation token org-wide so it carries write access to
      # the organization-owned package (a repo-scoped token is denied).
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: github-app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          # Authenticate as the GitHub App bot, not the human actor, so the token
          # identity matches the installation that holds package-write access.
          username: ${{ steps.github-app-token.outputs.app-slug }}
          password: ${{ steps.github-app-token.outputs.token }}

      - name: Build & push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
